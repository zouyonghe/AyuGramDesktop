name: Release

on:
  push:
    tags:
      - "v*-ayu.*"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the source commit
        required: false
        default: dev
        type: string
      commit:
        description: Commit SHA or ref; defaults to latest commit on branch
        required: false
        type: string
      tag:
        description: Base version tag; defaults to latest vMAJOR.MINOR.PATCH tag
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Resolve release source and tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            branch="${INPUT_BRANCH:-dev}"
            requested_commit="${INPUT_COMMIT:-$branch}"
            encoded_commit=$(jq -rn \
              --arg value "$requested_commit" \
              '$value | @uri')
            commit=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$encoded_commit" \
              --jq '.sha')
            base_tag="$INPUT_TAG"
            if [ -z "$base_tag" ]; then
              base_tag=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
                --jq '.[].name' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1)
            fi
          else
            tag="$REF_NAME"
            commit="$GITHUB_SHA"
            base_tag="${tag%-ayu.*}"
          fi
          if ! [[ "$base_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Base tag must match vMAJOR.MINOR.PATCH: $base_tag" >&2
            exit 1
          fi
          short_sha="${commit:0:7}"
          expected_tag="$base_tag-ayu.$short_sha"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$expected_tag"
          elif [ "$tag" != "$expected_tag" ]; then
            echo "Tag $tag does not match source commit $short_sha" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.commit }}
        run: |
          if gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              >/dev/null 2>&1; then
            existing=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$TAG" \
              --jq '.sha')
            if [ "$existing" != "$SHA" ]; then
              echo "Tag $TAG points to $existing instead of $SHA" >&2
              exit 1
            fi
            exit 0
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA"

  linux:
    name: Linux x64
    needs: prepare
    uses: ./.github/workflows/linux-debug.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  windows:
    name: Windows x64
    needs: prepare
    uses: ./.github/workflows/windows-debug.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  macos:
    name: macOS arm64
    needs: prepare
    uses: ./.github/workflows/macos-debug.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - linux
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir release-assets
          tar -czf "release-assets/AyuGram-$TAG-linux-x64.tar.gz" \
            -C artifacts/AyuGram-Linux-Debug .
          (cd artifacts/AyuGram-Windows-x64-Debug && \
            zip -r "$GITHUB_WORKSPACE/release-assets/AyuGram-$TAG-windows-x64.zip" .)
          cp \
            artifacts/AyuGram-macOS-arm64-Debug/AyuGram-macOS-arm64-Debug.tar.gz \
            "release-assets/AyuGram-$TAG-macos-arm64.tar.gz"
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AyuGram $TAG" \
              --generate-notes \
              --verify-tag
          fi
