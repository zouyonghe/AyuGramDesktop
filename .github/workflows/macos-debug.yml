name: macOS Debug

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      configuration:
        required: false
        default: Debug
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch, or tag to build
        required: false
        type: string
      configuration:
        description: CMake build configuration
        required: false
        default: Debug
        type: string

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      BUILD_CONFIG: ${{ inputs.configuration || 'Debug' }}

    steps:
      - name: Set repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Clone
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}
          path: ${{ env.REPO_NAME }}

      - name: Set up build tools
        run: |
          sudo chown -R "$(whoami)":admin /usr/local/share
          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Restore libraries cache
        uses: actions/cache@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.os }}-libs-

      - name: Prepare libraries
        run: ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free disk space
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Build AyuGram Desktop
        run: |
          cd "$REPO_NAME/Telegram"
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES="$BUILD_CONFIG" \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_TEST=ON \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ../out --config "$BUILD_CONFIG" --parallel

      - name: Check output
        run: |
          test -d "$REPO_NAME/out/$BUILD_CONFIG/AyuGram.app"
          test -f "$REPO_NAME/out/$BUILD_CONFIG/Updater"
          du -sh "$REPO_NAME/out/$BUILD_CONFIG/AyuGram.app" "$REPO_NAME/out/$BUILD_CONFIG/Updater"

      - name: Prepare artifact
        run: |
          cd "$REPO_NAME/out/$BUILD_CONFIG"
          tar -czf "AyuGram-macOS-arm64-$BUILD_CONFIG.tar.gz" AyuGram.app Updater

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-macOS-arm64-${{ inputs.configuration || 'Debug' }}
          path: ${{ env.REPO_NAME }}/out/${{ inputs.configuration || 'Debug' }}/AyuGram-macOS-arm64-${{ inputs.configuration || 'Debug' }}.tar.gz
          retention-days: 7
